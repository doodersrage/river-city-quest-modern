name: map data
# Downloads the real streets and buildings for each neighborhood from OpenStreetMap, and the ground heights from
# the Terrain Tiles open data set, and stores the raw files
# on the osm-raw branch, where tools/osm/build.js turns them into the game's maps.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/osm/fetch.js', 'tools/osm/elev.js', 'tools/osm/districts.json', '.github/workflows/osm.yml']
permissions:
  contents: write
concurrency:
  group: osm
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick up what was downloaded before
        run: |
          mkdir -p osm-raw
          git fetch -q --depth 1 origin osm-raw 2>/dev/null && git archive FETCH_HEAD | tar -x -C osm-raw || echo "nothing yet"
          rm -f osm-raw/index.json; find osm-raw -type f ! -name '*.v2.json.gz' -delete; ls osm-raw | wc -l
      - name: Download from OpenStreetMap
        run: node tools/osm/fetch.js osm-raw
      - name: Download ground heights
        if: always()
        run: node tools/osm/elev.js osm-raw || echo "no heights this time"
      - name: Store on the osm-raw branch
        if: always()
        run: |
          mkdir pub && cp -r osm-raw/* pub/ && cd pub
          ls *_*.json >/dev/null 2>&1 && gzip -9 *_*.json
          git init -q -b osm-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Raw OpenStreetMap data for the game's neighborhoods (ODbL, (c) OpenStreetMap contributors)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" osm-raw
