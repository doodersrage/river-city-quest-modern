name: map data
# Downloads the real streets and buildings for each neighborhood from OpenStreetMap and stores the raw files
# on the osm-raw branch, where tools/osm/build.js turns them into the game's maps.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/osm/fetch.js', 'tools/osm/districts.json', '.github/workflows/osm.yml']
permissions:
  contents: write
concurrency:
  group: osm
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download from OpenStreetMap
        run: node tools/osm/fetch.js osm-raw
      - name: Store on the osm-raw branch
        run: |
          mkdir pub && cp -r osm-raw/* pub/ && cd pub
          gzip -9 *_*.json
          git init -q -b osm-raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Raw OpenStreetMap data for the game's neighborhoods (ODbL, (c) OpenStreetMap contributors)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" osm-raw
