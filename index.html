<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06081a">
<meta name="description" content="River City Quest: a Zelda-like 3D adventure through Richmond, Virginia.">
<title>River City Quest</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
html,body{margin:0;height:100%;background:#06081a;color:#e8ecf8;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#screen{position:relative;width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3;background:#000;box-shadow:0 0 40px #000}
#screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#camzone{position:absolute;right:0;top:0;width:50%;height:100%;display:none}
#pad{display:none;width:100%;max-width:640px;height:200px;position:relative;flex:none}
#stick{position:absolute;left:22px;bottom:22px;width:140px;height:140px;border-radius:50%;background:rgba(58,76,176,.35);border:3px solid rgba(216,220,240,.5)}
#knob{position:absolute;left:43px;top:43px;width:54px;height:54px;border-radius:50%;background:rgba(216,220,240,.8);box-shadow:0 2px 6px #000}
.btn{position:absolute;border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:22px;color:#fff;border:3px solid rgba(216,220,240,.7);background:linear-gradient(#3a4cb0,#0c1458);box-shadow:0 3px 8px #000}
.btn.on{filter:brightness(1.6)}
.small{width:56px;height:34px;border-radius:17px;font-size:12px}
#bA{right:24px;bottom:70px}#bB{right:110px;bottom:30px}#bI{right:118px;bottom:132px}#bM{right:24px;bottom:160px}
#nogl{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;background:#06081a;font-size:18px}
@media (pointer:coarse){#pad{display:block}#camzone{display:block}#wrap{justify-content:flex-start;padding-top:max(12px,env(safe-area-inset-top))}}
@media (pointer:coarse) and (orientation:landscape){#wrap{flex-direction:row;justify-content:center;padding-top:0}#stick{left:8px}#screen{width:min(calc(100vw - 300px),calc(100vh*4/3))}#pad{position:fixed;inset:0;max-width:none;height:auto;pointer-events:none}#pad>*{pointer-events:auto}}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen"><canvas id="gl"></canvas><canvas id="hud"></canvas><div id="camzone"></div></div>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <div class="btn" id="bA" data-btn="a">A</div><div class="btn" id="bB" data-btn="b">B</div>
    <div class="btn small" id="bI" data-btn="item">ITEM</div><div class="btn small" id="bM" data-btn="menu">MENU</div>
  </div>
</div>
<div id="nogl">This game needs WebGL 2, which this browser doesn't have turned on.</div>
<script src="js/data.js"></script>
<script src="js/bigmap.js"></script>
<script src="js/mesh.js"></script>
<script src="js/tex.js"></script>
<script src="js/tex2.js"></script>
<script src="js/flora.js"></script>
<script src="js/bodydata.js"></script>
<script src="js/body.js"></script>
<script src="js/anim.js"></script>
<script src="js/skel.js"></script>
<script src="js/level.js"></script>
<script src="js/landmarks.js"></script>
<script src="js/models.js"></script>
<script src="js/fauna.js"></script>
<script src="js/creature.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/talk.js"></script>
<script src="js/render.js"></script>
<script src="js/gfx.js"></script>
<script src="js/hud.js"></script>
<script src="js/life.js"></script>
<script src="js/mini.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
